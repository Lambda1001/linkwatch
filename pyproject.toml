[project]
name = "linkwatch"
version = "0.1.0"
description = "Terminal-based network latency monitor"
requires-python = ">=3.10"
dependencies = [
	"rich",
	"pyyaml",
]

[project.scripts]
linkwatch = "cli:main"

[tool.setuptools]
packages = ["app"]
py-modules = ["cli"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
